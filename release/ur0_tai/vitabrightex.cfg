# VitaBrightEX Configuration File
# Copy this to ur0:/tai/vitabrightex.cfg (or ux0:/tai/)
# Lines starting with '#' are comments and are ignored.
# All values are optional — remove or comment out a line to use the default.
#
# ============================================================
# OLED settings (PS Vita 1000 only)
# ============================================================

# Set to 1 to load a specific LUT file instead of the auto-selected one.
# When set to 1, panel_lut_path must point to a valid LUT file.
oled_panel_lut_override = 0

# Path to a custom LUT file (only used when oled_panel_lut_override = 1)
# Example: panel_lut_path = ur0:tai/my_custom_lut.txt
# panel_lut_path =

# Per-channel colour bias (-127 to +127).
# Use small positive values to boost a channel, negative to reduce.
# Example: if your screen looks too red at low brightness, try color_r_bias = -8
color_r_bias = 0
color_g_bias = 0
color_b_bias = 0

# Night/warm mode: tints the image amber below a brightness threshold.
# 0 = off, 1 = on
night_mode_enabled = 0

# Brightness level (0-16) at and below which the night-mode tint is applied.
# Lower = only activates at very dim settings; higher = activates earlier.
night_mode_threshold = 6

# Dimming workaround: prevents auto-dim raising brightness at very low levels.
# 1 = enabled (recommended), 0 = disabled
oled_dim_workaround = 1

# ============================================================
# LCD settings (PS Vita 2000 only)
# ============================================================

# Enable wider colour gamut mode (closer to OLED appearance).
# Writes color_space_mode=1 to /CONFIG/DISPLAY registry.
# 1 = on (default), 0 = off
lcd_color_space_mode = 1

# Enable full RGB range (0-255) instead of limited (16-235).
# Writes rgb_range_mode=1 to /CONFIG/DISPLAY registry.
# 1 = on (default), 0 = off
lcd_rgb_range_mode = 1

# Enable saturation boost (same as lcd_color_space_mode, kept for clarity).
# 1 = on (default), 0 = off
lcd_saturation_boost = 1

# IPS-style enhancement: applies colour space change via live driver call
# (no reboot required, takes effect immediately).
# 1 = on (default), 0 = off
lcd_ips_enhance = 1

# ============================================================
# Screen Filter — Rosalina-equivalent colour pipeline
# Works on both PS Vita 1000 (OLED) and PS Vita 2000 (LCD).
# All values are optional; defaults give a neutral image.
# ============================================================

# Colour temperature in Kelvin (1000–25100).
# Lower = warmer/amber (night use), higher = cooler/blue.
# Presets for reference:
#   6500 = default neutral D65
#   5500 = daylight
#   4200 = fluorescent office
#   3400 = halogen lamp
#   2700 = incandescent bulb (warm)
#   1900 = candlelight
filter_cct = 6500

# Gamma exponent (0.1–8.0). Default = 1.0 (no correction).
# < 1.0 = brighter midtones (useful for dim environments)
# > 1.0 = darker midtones (more contrast)
filter_gamma = 1.0

# Contrast multiplier (0.0–4.0). Default = 1.0.
filter_contrast = 1.0

# Brightness offset (−1.0 to 1.0). Default = 0.0.
# Positive = raises black level (washed out); negative = crushes blacks.
filter_brightness = 0.0

# Invert all colours. 0 = off, 1 = on.
filter_invert = 0

# Panel colour curve enhancement.
# 0 = off (default)
# 1 = IPS fix: corrects the non-linear gamma roll-off of IPS LCD panels
#     (Vita 2000) and replacement OLED panels.  Recommended for Vita 2000.
# 2 = sRGB fix: applies a full sRGB linearisation curve.
filter_panel_enhance = 0
